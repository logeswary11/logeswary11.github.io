name: Publish site and sync Beehiiv
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Check twice an hour; GitHub scheduling may be delayed.
    - cron: '17,47 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Sync Beyond the Pitch Deck
        env:
          BEEHIIV_API_KEY: ${{ secrets.BEEHIIV_API_KEY }}
          BEEHIIV_PUBLICATION_ID: ${{ secrets.BEEHIIV_PUBLICATION_ID }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 scripts/sync_writings.py
          else
            python3 scripts/sync_writings.py --allow-unconfigured
          fi
      - name: Prepare public files
        run: python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
